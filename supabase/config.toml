# Configuratie voor de Supabase CLI (`supabase start` voor lokale ontwikkeling met Docker).
project_id = "ruimte"

[api]
schemas = ["public"]

[db]
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
